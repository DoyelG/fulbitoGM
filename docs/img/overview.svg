<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 1088" width="1110" height="1088" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Panorama general de Fulbito GM</title>
  <desc id="desc">Arriba, cómo viaja un dato, de izquierda a derecha. Los datos viven en Firebase (Auth, Firestore, Storage). El paquete @fulbito/firebase es el punto de acceso a Firebase. Cada app (web, mobile y mcp) toma esos datos en su capa de lógica (web y mobile leen y escriben; el MCP solo lee), los muestra en sus pantallas y los usa la gente: navegador, celular o Claude. Los paquetes utils y types los usan las tres apps. Abajo, cómo llega cada parte a producción: la web por GitHub Actions a Vercel, las reglas con firebase deploy a mano, mobile con EAS Build a mano y el MCP no se publica.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8 5 L1.5 8.5" fill="none" stroke="#8f8e96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-read" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8 5 L1.5 8.5" fill="none" stroke="#ef9f27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g transform="translate(0 20)">

    <!-- Parte 1 · Cómo viaja un dato (se lee de izquierda a derecha) -->
