    <text x="615.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">3 · Lógica de la app</text>
    <text x="805.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">4 · Pantallas</text>
    <text x="995.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">5 · Quién lo usa</text>

