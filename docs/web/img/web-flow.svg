<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 1042" width="1210" height="1042" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Cómo está organizada la app web</title>
  <desc id="desc">Arriba, cómo viaja un dato en la web: Firebase, el paquete @fulbito/firebase iniciado en src/lib/firebase.ts, el estado en los stores de Zustand y el contexto de sesión, las pantallas en src/app con sus componentes, y el navegador. Debajo, el código de apoyo: utils, types, hooks y lib. Abajo, dónde se hace cada tipo de cambio y qué más hay que tocar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8 5 L1.5 8.5" fill="none" stroke="#8f8e96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g transform="translate(0 20)">

    <!-- Parte 1 · Cómo viaja un dato en la web (de izquierda a derecha) -->
    <text x="20" y="22" font-size="15" font-weight="700" fill="#8f8e96" text-anchor="start">Cómo viaja un dato en la web</text>
    <text x="120.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">1 · Datos</text>
    <text x="364.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">2 · Acceso</text>
    <text x="613.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">3 · Estado</text>
    <text x="879.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">4 · Pantalla</text>
    <text x="1115.0" y="62" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">5 · Navegador</text>

    <!-- 1 · Firebase -->
    <rect x="20" y="84" width="200" height="274" rx="12" fill="none" stroke="#4fbf98" stroke-opacity="0.7"/>
    <text x="40" y="109" font-size="12" font-weight="700" fill="#4fbf98" text-anchor="start">Firebase</text>
    <rect x="40" y="124.0" width="160" height="62" rx="8" fill="#0f4d3a" stroke="#4fbf98" stroke-width="1.2"/>
    <text x="120.0" y="151.0" font-size="14" font-weight="600" fill="#d5f5e8" text-anchor="middle">Firestore</text>
    <text x="120.0" y="169.0" font-size="12" font-weight="400" fill="#9fdcc3" text-anchor="middle">partidos, jugadores…</text>
    <rect x="40" y="200.0" width="160" height="62" rx="8" fill="#0f4d3a" stroke="#4fbf98" stroke-width="1.2"/>
    <text x="120.0" y="227.0" font-size="14" font-weight="600" fill="#d5f5e8" text-anchor="middle">Auth</text>
    <text x="120.0" y="245.0" font-size="12" font-weight="400" fill="#9fdcc3" text-anchor="middle">login y usuarios</text>
    <rect x="40" y="276.0" width="160" height="62" rx="8" fill="#0f4d3a" stroke="#4fbf98" stroke-width="1.2"/>
    <text x="120.0" y="303.0" font-size="14" font-weight="600" fill="#d5f5e8" text-anchor="middle">Storage</text>
    <text x="120.0" y="321.0" font-size="12" font-weight="400" fill="#9fdcc3" text-anchor="middle">fotos y videos</text>
    <path d="M220 221.0 L276 221.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- 2 · @fulbito/firebase -->
    <rect x="276" y="84" width="176" height="274" rx="12" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="364.0" y="187.0" font-size="14" font-weight="700" fill="#e6e3fb" text-anchor="middle">@fulbito/firebase</text>
    <text x="364.0" y="205.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">packages/firebase</text>
    <text x="364.0" y="239.0" font-size="12" font-weight="600" fill="#e6e3fb" text-anchor="middle">se inicia en</text>
    <text x="364.0" y="255.0" font-size="12" font-weight="600" fill="#e6e3fb" text-anchor="middle">src/lib/firebase.ts</text>
    <path d="M452 221.0 L508 221.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- 3 · Estado: stores y sesión -->
    <rect x="508" y="84" width="210" height="274" rx="12" fill="none" stroke="#7a7982" stroke-opacity="0.55" stroke-dasharray="5 4"/>
    <text x="528" y="109" font-size="12" font-weight="600" fill="#7a7982" text-anchor="start">src/store · src/contexts</text>
    <rect x="528" y="162.0" width="170" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="613.0" y="189.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">Stores (Zustand)</text>
    <text x="613.0" y="207.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">uno por colección</text>
    <rect x="528" y="238.0" width="170" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="613.0" y="265.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">Sesión y rol</text>
    <text x="613.0" y="283.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">FirebaseAuthContext</text>
    <path d="M718 221.0 L774 221.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- 4 · Pantalla: layout, rutas y componentes -->
    <rect x="774" y="84" width="210" height="274" rx="12" fill="none" stroke="#7a7982" stroke-opacity="0.55" stroke-dasharray="5 4"/>
    <text x="794" y="109" font-size="12" font-weight="600" fill="#7a7982" text-anchor="start">src/app · src/components</text>
    <rect x="794" y="124.0" width="170" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="879.0" y="151.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">layout.tsx</text>
    <text x="879.0" y="169.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">NavBar y proveedores</text>
    <rect x="794" y="200.0" width="170" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="879.0" y="227.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">&lt;ruta&gt;/page.tsx</text>
    <text x="879.0" y="245.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">+ &lt;ruta&gt;Client.tsx</text>
    <rect x="794" y="276.0" width="170" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="879.0" y="303.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">components/</text>
    <text x="879.0" y="321.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">UI compartida</text>
    <path d="M984 221.0 L1040 221.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <!-- 5 · Navegador -->
    <rect x="1040" y="190.0" width="150" height="62" rx="8" fill="#0c3f5c" stroke="#4fa8d8" stroke-width="1.2"/>
    <text x="1115.0" y="217.0" font-size="14" font-weight="600" fill="#d6ecf8" text-anchor="middle">Navegador</text>
    <text x="1115.0" y="235.0" font-size="12" font-weight="400" fill="#9ccbe6" text-anchor="middle">publicada en Vercel</text>

    <!-- Apoyo: lo usan las pantallas, no hablan con Firebase -->
    <rect x="276" y="372" width="914" height="122" rx="12" fill="none" stroke="#7a7982" stroke-opacity="0.55" stroke-dasharray="5 4"/>
    <text x="296" y="397" font-size="12" font-weight="600" fill="#7a7982" text-anchor="start">Apoyo · lo usan las pantallas y no hablan con Firebase</text>
    <rect x="296.0" y="412" width="208.0" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="400.0" y="439.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">@fulbito/utils</text>
    <text x="400.0" y="457.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">cálculos</text>
    <rect x="518.0" y="412" width="208.0" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="622.0" y="439.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">@fulbito/types</text>
    <text x="622.0" y="457.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">modelo</text>
    <rect x="740.0" y="412" width="208.0" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="844.0" y="439.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">src/hooks</text>
    <text x="844.0" y="457.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">lógica entre pantallas</text>
    <rect x="962.0" y="412" width="208.0" height="62" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="1066.0" y="439.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">src/lib</text>
    <text x="1066.0" y="457.0" font-size="12" font-weight="400" fill="#b9b4ee" text-anchor="middle">inicio y atajos a utils</text>
    <path d="M20 528 L1190 528" stroke="#8f8e96" stroke-opacity="0.3"/>

    <!-- Parte 2 · Dónde se hace cada cambio: qué → dónde → qué más tocar -->
    <text x="20" y="564" font-size="15" font-weight="700" fill="#8f8e96" text-anchor="start">Dónde se hace cada cambio</text>
    <text x="120.0" y="598" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">Qué</text>
    <text x="511.0" y="598" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">Dónde</text>
    <text x="988.0" y="598" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">Qué más tocar</text>
    <rect x="20" y="620" width="200" height="58" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="120.0" y="654.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">Una pantalla nueva</text>
    <path d="M220 649.0 L276 649.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="276" y="620" width="470.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="511.0" y="645.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">src/app/&lt;ruta&gt;/</text>
    <text x="511.0" y="663.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">page.tsx y &lt;ruta&gt;Client.tsx</text>
    <path d="M746.0 649.0 L786.0 649.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="786.0" y="620" width="404.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="988.0" y="645.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">app/NavBar.tsx</text>
    <text x="988.0" y="663.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">agregar el enlace si va en el menú</text>
    <rect x="20" y="692" width="200" height="58" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="120.0" y="726.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">Leer o guardar un dato</text>
    <path d="M220 721.0 L276 721.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="276" y="692" width="470.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="511.0" y="717.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">packages/firebase</text>
    <text x="511.0" y="735.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">la función que habla con Firestore</text>
    <path d="M746.0 721.0 L786.0 721.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="786.0" y="692" width="404.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="988.0" y="717.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">src/store</text>
    <text x="988.0" y="735.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">la acción del store que la usa</text>
    <rect x="20" y="764" width="200" height="58" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="120.0" y="798.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">Un cálculo</text>
    <path d="M220 793.0 L276 793.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="276" y="764" width="470.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="511.0" y="789.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">packages/utils</text>
    <text x="511.0" y="807.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">función pura, sin React</text>
    <path d="M746.0 793.0 L786.0 793.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="786.0" y="764" width="404.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="988.0" y="789.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">&lt;ruta&gt;Client.tsx o src/hooks</text>
    <text x="988.0" y="807.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">donde se muestra el resultado</text>
    <rect x="20" y="836" width="200" height="58" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="120.0" y="870.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">UI reutilizable</text>
    <path d="M220 865.0 L276 865.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="276" y="836" width="470.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="511.0" y="861.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">src/components/</text>
    <text x="511.0" y="879.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">PascalCase, export default</text>
    <path d="M746.0 865.0 L786.0 865.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="786.0" y="836" width="404.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="988.0" y="861.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">las pantallas que la usan</text>
    <text x="988.0" y="879.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">reemplazar lo duplicado</text>
    <rect x="20" y="908" width="200" height="58" rx="8" fill="#3c3489" stroke="#7f77dd" stroke-width="1.2"/>
    <text x="120.0" y="942.0" font-size="14" font-weight="600" fill="#e6e3fb" text-anchor="middle">Quién puede hacer algo</text>
    <path d="M220 937.0 L276 937.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="276" y="908" width="470.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="511.0" y="933.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">firestore.rules · storage.rules</text>
    <text x="511.0" y="951.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">la UI solo esconde botones</text>
    <path d="M746.0 937.0 L786.0 937.0" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="786.0" y="908" width="404.0" height="58" rx="8" fill="none" stroke="#8f8e96" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="988.0" y="933.0" font-size="13" font-weight="600" fill="#8f8e96" text-anchor="middle">firebase deploy</text>
    <text x="988.0" y="951.0" font-size="11" font-weight="400" fill="#8f8e96" text-anchor="middle">a mano, desde la raíz</text>

    <!-- Leyenda -->
    <rect x="20" y="991" width="13" height="13" rx="3" fill="#0f4d3a" stroke="#4fbf98"/>
    <text x="40" y="1002" font-size="12" font-weight="400" fill="#8f8e96" text-anchor="start">Firebase</text>
    <rect x="120" y="991" width="13" height="13" rx="3" fill="#3c3489" stroke="#7f77dd"/>
    <text x="140" y="1002" font-size="12" font-weight="400" fill="#8f8e96" text-anchor="start">nuestro código</text>
    <rect x="262" y="991" width="13" height="13" rx="3" fill="#0c3f5c" stroke="#4fa8d8"/>
    <text x="282" y="1002" font-size="12" font-weight="400" fill="#8f8e96" text-anchor="start">dónde se usa</text>
    <rect x="390" y="991" width="13" height="13" rx="3" fill="none" stroke="#8f8e96" stroke-dasharray="3 2"/>
    <text x="410" y="1002" font-size="12" font-weight="400" fill="#8f8e96" text-anchor="start">dónde hacer el cambio</text>
    <path d="M581 998 L607 998" stroke="#8f8e96" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="615" y="1002" font-size="12" font-weight="400" fill="#8f8e96" text-anchor="start">lee y escribe</text>
  </g>
</svg>
